name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # PostgreSQL integration job. Uses ONLY the disposable service container below with test
  # credentials: no remote database, no provider, no secrets. Lint, typecheck, unit tests and the
  # build (which already cover src/db) stay in the `verify` job above.
  database:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: al_ict_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d al_ict_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Dedicated CI application database: migrated from empty by `db:migrate` below.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/al_ict_ci
      # Used by the DB test harness to create/drop isolated scratch databases. The harness refuses
      # non-local hosts; this points at the service container on localhost.
      TEST_DATABASE_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Validate migration folder consistency
        run: npm run db:check
      - name: Detect schema/migration drift
        run: |
          npm run db:generate
          changes="$(git status --porcelain --untracked-files=all -- src/db/migrations)"
          if [ -n "$changes" ]; then
            echo "::error::Schema and committed migrations are out of sync. Run 'npm run db:generate', review the new migration, and commit it."
            echo "$changes"
            git --no-pager diff -- src/db/migrations
            exit 1
          fi
      - name: Migrate the clean CI database from empty
        run: npm run db:migrate
      - name: Confirm migrations were applied
        run: >-
          node -e "const { Client } = require('pg'); (async () => { const c = new Client({ connectionString: process.env.DATABASE_URL }); await c.connect();
          const m = (await c.query('select count(*)::int n from drizzle.__drizzle_migrations')).rows[0].n;
          const t = (await c.query(\"select count(*)::int n from information_schema.tables where table_schema = 'public'\")).rows[0].n;
          console.log('migrations applied:', m, 'public tables:', t); await c.end(); if (m < 1 || t < 1) process.exit(1); })().catch((e) => { console.error(e); process.exit(1); })"
      - name: Database integration tests
        run: npm run test:db

  # Real-browser end-to-end job (Chromium). Like `database`, it uses ONLY a disposable PostgreSQL service container
  # with test credentials. scripts/e2e.ts creates a dedicated al_ict_e2e_* database, migrates and seeds it, serves the
  # production build over HTTPS with a throwaway certificate, runs Playwright, and drops the database afterwards.
  # The auth secret and URL are test-only values defined in that script; nothing here is a real secret.
  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Match the bot fixture's exact isolated-server boundary; never use the application database.
      TEST_DATABASE_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:55432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Verify isolated E2E PostgreSQL service
        env:
          E2E_POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          node --import tsx --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { resolveAdminTarget } from './src/db/__tests__/helpers.ts';

          let check = 'administrative target';
          try {
            const target = resolveAdminTarget(); // Driver-effective validation, no database connection.
            assert.equal(target.host, '127.0.0.1');
            assert.equal(target.port, 55432);
            assert.equal(target.database, 'postgres');
            assert.equal(target.user, 'postgres');
            assert.equal(target.password, 'postgres'); // This service's disposable credentials only.
            for (const [name, value] of Object.entries(process.env))
              if (name !== 'TEST_DATABASE_ADMIN_URL' && /^(DATABASE_|TEST_DATABASE_|PG)|^E2E_DATABASE_URL$/.test(name))
                assert.ok(!value);

            check = 'job service identity and port';
            const id = process.env.E2E_POSTGRES_SERVICE_ID;
            assert.match(id ?? '', /^[0-9a-f]{64}$/);
            const docker = (...args) => execFileSync('docker', args, {
              encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'], timeout: 10000,
            });
            const [container] = JSON.parse(docker('inspect', '--type', 'container', id));
            assert.equal(container.Id, id);
            assert.equal(container.Config.Image, 'postgres:17');
            assert.equal(container.State.Running, true);
            assert.equal(container.State.Health.Status, 'healthy');
            const bindings = container.NetworkSettings.Ports['5432/tcp'];
            assert.ok(bindings?.length > 0);
            assert.ok(bindings.every(p => p.HostPort === '55432'));
            assert.ok(bindings.some(p => ['127.0.0.1', '0.0.0.0'].includes(p.HostIp)));

            check = 'fresh anonymous PostgreSQL storage';
            // Image-created anonymous storage is allowed; explicit/reused/host-mounted storage is not.
            for (const field of ['Binds', 'Mounts', 'VolumesFrom'])
              assert.equal((container.HostConfig[field] ?? []).length, 0);
            assert.equal(Object.keys(container.HostConfig.Tmpfs ?? {}).length, 0);
            assert.ok(container.Config.Env.includes('PGDATA=/var/lib/postgresql/data'));
            assert.equal(container.Mounts.length, 1);
            const [mount] = container.Mounts;
            assert.equal(mount.Type, 'volume');
            assert.equal(mount.Destination, '/var/lib/postgresql/data');
            assert.equal(mount.Driver, 'local');
            assert.match(mount.Name, /^[0-9a-f]{64}$/);
            const [volume] = JSON.parse(docker('volume', 'inspect', mount.Name));
            assert.equal(volume.Driver, 'local');
            assert.equal(Object.keys(volume.Options ?? {}).length, 0);
            const age = Date.parse(container.Created) - Date.parse(volume.CreatedAt);
            assert.ok(Number.isFinite(age) && Math.abs(age) <= 60000);
            assert.equal(docker('ps', '-a', '--no-trunc', '--filter', `volume=${mount.Name}`, '--format', '{{.ID}}').trim(), id);
            console.log(`E2E PostgreSQL service ${id}: verified 127.0.0.1:55432, fresh anonymous storage.`);
          } catch {
            console.error(`::error::E2E PostgreSQL preflight refused: ${check}.`);
            process.exit(1);
          }
          NODE
      - name: Install Chromium and its system dependencies
        run: npx playwright install --with-deps chromium
      - name: Production build
        run: npm run build
      - name: Browser E2E tests
        run: npm run test:e2e
        env:
          E2E_SKIP_BUILD: "1" # built in the previous step
      # Traces contain request bodies and cookies (fake test passwords and sessions of a database already dropped);
      # they are uploaded for failures only and expire quickly.
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-artifacts
          path: |
            playwright-report/
            test-results/
            e2e-output/
          retention-days: 7
          if-no-files-found: ignore
